name: Backend CI

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Dsw2025Tpi.sln

      - name: Build Release (warnings are errors)
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore --warnaserror

      - name: Build container image
        run: docker build --file Dockerfile --tag ics2026-backend:ci .

      - name: Generate ephemeral test credentials
        id: test-credentials
        shell: bash
        run: |
          admin_password="Ci-$(openssl rand -hex 24)"
          jwt_key="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$admin_password"
          printf '::add-mask::%s\n' "$jwt_key"
          {
            printf 'admin_password=%s\n' "$admin_password"
            printf 'jwt_key=%s\n' "$jwt_key"
          } >> "$GITHUB_OUTPUT"
          unset admin_password jwt_key

      - name: Run complete test suite
        env:
          ICS_TEST_ADMIN_PASSWORD: ${{ steps.test-credentials.outputs.admin_password }}
          ICS_TEST_JWT_KEY: ${{ steps.test-credentials.outputs.jwt_key }}
        run: dotnet test Dsw2025Tpi.sln --configuration Release --no-build --no-restore

  publish:
    name: Publish backend image
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Docker Hub configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKER_IMAGE" ]]; then
            echo '::error::The DOCKER_IMAGE repository variable is not configured.'
            exit 1
          fi
          if [[ "$DOCKER_IMAGE" != 'ulisesquiroga/ics2026-backend' ]]; then
            echo '::error::DOCKER_IMAGE must be ulisesquiroga/ics2026-backend.'
            exit 1
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be configured as repository secrets.'
            exit 1
          fi
          echo 'Docker Hub variable and secrets are available.'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish validated commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:sha-${{ github.sha }}

      - name: Add image references to the workflow summary
        shell: bash
        run: |
          {
            echo '## Docker Hub publication'
            echo
            echo "Validated commit: \`${GITHUB_SHA}\`"
            echo
            echo 'Published tags:'
            echo "- \`${DOCKER_IMAGE}:latest\`"
            echo "- \`${DOCKER_IMAGE}:sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
